<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail - Premium Email Client</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3e%3cpath d='M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/%3e%3c/svg%3e">
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    
    <!-- Header -->
    <header class="header glass-panel">
        <div class="header-left">
            <button class="icon-button" id="menu-toggle">
                <i data-feather="menu"></i>
            </button>
            <div class="logo">
                <div class="logo-icon">
                    <i data-feather="mail"></i>
                </div>
                <span>TempMail</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-wrapper">
                <i data-feather="search" class="search-icon"></i>
                <input type="text" class="search-box" placeholder="Search emails...">
            </div>
        </div>
        <div class="header-right">
            <button class="icon-button" id="refresh-btn" title="Refresh">
                <i data-feather="refresh-cw"></i>
            </button>
            <button class="icon-button" id="theme-toggle" title="Toggle dark mode">
                <i data-feather="sun"></i>
            </button>
            <button class="icon-button" id="settings-btn" title="Settings">
                <i data-feather="settings"></i>
            </button>
        </div>
    </header>

    <div class="email-app">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="email-setup">
                    <select id="domain-select" class="domain-select" aria-label="Select domain" style="margin-bottom: 8px; width: 100%;">
                        <option value="">Loading...</option>
                    </select>
                    <div class="email-input-group">
                        <input type="text" id="email-prefix" class="email-prefix-input" placeholder="Enter email prefix" autocomplete="off">
                        <button class="btn btn-primary btn-icon" id="register-email-btn" title="Create Email">
                            <i data-feather="plus"></i>
                        </button>
                    </div>
                    <div class="current-email-display">
                        <div class="current-email" id="current-email">
                            No email registered yet
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="copy-email-btn" disabled title="Copy Email">
                            <i data-feather="copy"></i>
                        </button>
                        <button class="btn btn-primary" id="start-listening-btn" disabled title="Listen for Emails">
                            <i data-feather="play"></i>
                        </button>
                        <button class="btn btn-secondary hidden" id="logout-btn" title="Forget Email">
                            <i data-feather="log-out"></i>
                        </button>
                    </div>
                    <div class="active-inboxes-container hidden" id="active-inboxes-container" style="margin-top: 20px;">
                        <div class="nav-section-title" style="margin-bottom: 8px;">Active Inboxes</div>
                        <div class="inbox-list" id="inbox-list" style="display: flex; flex-direction: column; gap: 8px;">
                            <!-- Active inboxes injected here -->
                        </div>
                    </div>
                </div>
            </div>

            <nav class="folder-nav">
                <div class="nav-section-title">Folders</div>
                <div class="folder-item active" data-folder="inbox">
                    <div class="folder-item-content">
                        <i data-feather="inbox"></i>
                        <span>Inbox</span>
                    </div>
                    <span class="folder-count" id="inbox-count">0</span>
                </div>
                <div class="folder-item" data-folder="sent">
                    <div class="folder-item-content">
                        <i data-feather="send"></i>
                        <span>Sent</span>
                    </div>
                    <span class="folder-count" id="sent-count">0</span>
                </div>
                <div class="folder-item" data-folder="drafts">
                    <div class="folder-item-content">
                        <i data-feather="edit-3"></i>
                        <span>Drafts</span>
                    </div>
                    <span class="folder-count" id="drafts-count">0</span>
                </div>
                <div class="folder-item" data-folder="trash">
                    <div class="folder-item-content">
                        <i data-feather="trash-2"></i>
                        <span>Trash</span>
                    </div>
                    <span class="folder-count" id="trash-count">0</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Email List View -->
            <div class="email-list-view glass-panel" id="email-list-view">
                <div class="content-header">
                    <h1 class="content-title" id="folder-title">Inbox</h1>
                    <div class="content-actions">
                        <button class="btn btn-ghost" id="select-all-btn">
                            <i data-feather="check-square"></i>
                            Select All
                        </button>
                        <button class="btn btn-ghost" id="mark-read-btn">
                            <i data-feather="mail"></i>
                            Mark Read
                        </button>
                    </div>
                </div>
                
                <div class="email-list-container">
                    <div class="email-list" id="email-list">
                        <div class="empty-state" id="initial-loading">
                            <div class="empty-state-icon">
                                <i data-feather="mail"></i>
                            </div>
                            <h3>Welcome to TempMail</h3>
                            <p>Register an email prefix to start receiving messages securely and privately.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Email Detail View -->
            <div class="email-detail glass-panel" id="email-detail">
                <div class="email-detail-header">
                    <div class="detail-actions-top">
                        <button class="btn btn-ghost icon-only" id="back-to-list" title="Back to list">
                            <i data-feather="arrow-left"></i>
                        </button>
                        <div class="email-detail-meta">
                            <span class="detail-date" id="detail-date"></span>
                        </div>
                    </div>
                    <h2 class="email-detail-subject" id="detail-subject"></h2>
                    <div class="email-sender-info">
                        <div class="sender-avatar" id="sender-avatar"></div>
                        <div class="sender-details">
                            <div class="sender-name" id="detail-from"></div>
                            <div class="sender-email" id="detail-from-email"></div>
                        </div>
                    </div>
                </div>
                
                <div class="email-detail-actions">
                    <button class="btn btn-secondary" id="reply-btn">
                        <i data-feather="corner-up-left"></i> Reply
                    </button>
                    <button class="btn btn-secondary" id="forward-btn">
                        <i data-feather="corner-up-right"></i> Forward
                    </button>
                    <div class="spacer"></div>
                    <button class="btn btn-ghost icon-only" id="delete-btn" title="Delete">
                        <i data-feather="trash-2"></i>
                    </button>
                    <button class="btn btn-ghost icon-only" id="star-btn" title="Star">
                        <i data-feather="star"></i>
                    </button>
                </div>
                
                <div class="email-detail-content">
                    <div class="email-html-content" id="detail-content"></div>
                    <div class="email-attachments" id="detail-attachments" style="display: none;">
                        <h3><i data-feather="paperclip"></i> Attachments</h3>
                        <div class="attachments-grid" id="attachments-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
